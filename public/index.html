<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAP Informática · Productos y servicios de tecnología</title>
    <meta name="description" content="Tienda de informática: laptops, computadoras, componentes, periféricos y redes. Servicio técnico, armado de PC e instalación de redes.">
    <meta name="theme-color" content="#26308f">

    <link rel="icon" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

<header class="top">
    <!-- Franja de contacto -->
    <div class="util">
        <div class="wrap util-row">
            <span class="util-item"><span data-icon="truck"></span><span data-txt="envio"></span></span>
            <span class="util-item"><span data-icon="clock"></span><span data-contact="horario"></span></span>
            <span class="util-item util-right"><span data-icon="phone"></span><span data-contact="telefono"></span></span>
            <span class="util-item"><span data-icon="mail"></span><span data-contact="email"></span></span>
        </div>
    </div>

    <!-- Marca, buscador y carrito -->
    <div class="wrap head">
        <button class="icon-btn burger" id="btnMenu" aria-label="Menú" aria-controls="nav" aria-expanded="false"><span data-icon="menu"></span></button>

        <a class="brand" href="#inicio" aria-label="CIAP inicio">
            <img class="brand-logo" id="brandLogo" src="assets/img/logo-sm.webp" alt="" width="126" height="160">
            <span class="brand-text">
                <span class="brand-name" data-cfg="nombre">CIAP</span>
                <span class="brand-sub" data-cfg="subtitulo">Informática</span>
            </span>
        </a>

        <form class="search" id="searchForm" role="search">
            <select id="searchCat" aria-label="Categoría"></select>
            <input type="search" id="searchInput" autocomplete="off" aria-label="Buscar productos">
            <button class="search-btn" aria-label="Buscar"><span data-icon="search"></span><span class="search-txt">Buscar</span></button>
        </form>

        <div class="actions">
            <button class="icon-btn" id="btnFavs" title="Favoritos" aria-label="Favoritos"><span data-icon="heart"></span><span class="count" data-fav-count hidden>0</span></button>
            <button class="cart-btn" id="btnCart" aria-label="Carrito">
                <span data-icon="cart"></span>
                <span class="cart-txt"><small>Mi carrito</small><b data-cart-total></b></span>
                <span class="count" data-cart-count hidden>0</span>
            </button>
        </div>
    </div>

    <!-- Menú -->
    <div class="navbar">
        <div class="wrap nav-row">
            <div class="cats">
                <button class="cats-btn" id="btnCats" aria-haspopup="true" aria-expanded="false"><span data-icon="menu"></span>Todas las categorías</button>
                <div class="cats-menu" id="catMenu" role="menu"></div>
            </div>
            <nav class="nav" id="nav" aria-label="Principal">
                <a href="#inicio" data-link="inicio">Inicio</a>
                <a href="#productos" data-link="productos">Productos</a>
                <a href="#servicios" data-link="servicios">Servicios</a>
                <a href="#nosotros" data-link="nosotros">Nosotros</a>
                <a href="#contacto" data-link="contacto">Contacto</a>
            </nav>
            <span class="nav-help"><span data-icon="headset"></span>Soporte: <b data-contact="telefono"></b></span>
        </div>
    </div>
</header>

<main class="stage">

    <!-- ========== INICIO ========== -->
    <section class="view view-home" data-view="inicio">
        <div class="wrap home">
            <div class="hero" id="feature" aria-label="Destacados"></div>
            <div class="benefits-row" id="benefits"></div>
            <div class="cat-tiles" id="catTiles"></div>
        </div>
    </section>

    <!-- ========== PRODUCTOS ========== -->
    <section class="view view-catalog" data-view="productos">
        <div class="wrap catalog">
            <aside class="cat-side">
                <h3>Categorías</h3>
                <div class="chips" id="chips" role="tablist" aria-label="Categorías"></div>
            </aside>
            <div class="catalog-main">
                <div class="catalog-bar">
                    <h2 id="catalogTitle">Todos los productos</h2>
                    <span class="muted" id="resultCount"></span>
                    <select id="sortSelect" class="input" aria-label="Ordenar">
                        <option value="destacado">Destacados</option>
                        <option value="precio-asc">Precio: menor a mayor</option>
                        <option value="precio-desc">Precio: mayor a menor</option>
                        <option value="nombre">Nombre A–Z</option>
                    </select>
                </div>
                <div class="catalog-body">
                    <div class="grid" id="productGrid"></div>
                    <p class="empty" id="emptyState" hidden></p>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== SERVICIOS ========== -->
    <section class="view" data-view="servicios">
        <div class="wrap pad">
            <div class="view-title">
                <h2 data-txt="servicios_titulo"></h2>
                <span class="muted" data-txt="servicios_texto"></span>
            </div>
            <div class="services" id="serviceGrid"></div>
        </div>
    </section>

    <!-- ========== NOSOTROS ========== -->
    <section class="view" data-view="nosotros">
        <div class="wrap pad about">
            <div>
                <span class="eyebrow">Nosotros</span>
                <h2 id="aboutTitle"></h2>
                <div id="aboutText"></div>
                <div class="stats" id="aboutStats"></div>
            </div>
            <div class="values" id="values"></div>
        </div>
    </section>

    <!-- ========== CONTACTO ========== -->
    <section class="view" data-view="contacto">
        <div class="wrap pad contact">
            <div>
                <span class="eyebrow">Contacto</span>
                <h2 data-txt="contacto_titulo"></h2>
                <p class="muted" data-txt="contacto_texto"></p>
                <ul class="contact-list" id="contactList"></ul>
            </div>
            <form class="panel form" id="contactForm">
                <div class="field"><label for="fNombre">Nombre</label><input class="input" id="fNombre" name="nombre" required maxlength="100"></div>
                <div class="field"><label for="fTelefono">Teléfono</label><input class="input" id="fTelefono" name="telefono" type="tel" maxlength="30"></div>
                <div class="field full"><label for="fAsunto">Asunto</label><select class="input" id="fAsunto" name="asunto"></select></div>
                <div class="field full"><label for="fMensaje">Mensaje</label><textarea class="input" id="fMensaje" name="mensaje" rows="4" required maxlength="1500"></textarea></div>
                <input type="text" name="website" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div class="full"><button class="btn btn-solid">Enviar por WhatsApp</button></div>
            </form>
        </div>
    </section>
</main>

<!-- ========== CARRITO LATERAL ========== -->
<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="cartDrawer" aria-labelledby="cartTitle" aria-hidden="true">
    <div class="drawer-head">
        <h3 id="cartTitle">Tu carrito</h3>
        <button class="icon-btn" id="btnCartClose" aria-label="Cerrar"><span data-icon="x"></span></button>
    </div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-foot" id="cartFoot">
        <div class="total-row"><span>Subtotal</span><strong id="cartSubtotal">S/ 0.00</strong></div>
        <button class="btn btn-solid w-100" id="btnCheckout">Pedir por WhatsApp</button>
    </div>
</aside>

<!-- ========== DETALLE DE PRODUCTO ========== -->
<dialog class="modal" id="productModal" aria-label="Detalle del producto"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
