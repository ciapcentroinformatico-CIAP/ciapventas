<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel · CIAP Informática</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231463ff' d='M0 0h24l8 8v24H8l-8-8z'/%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2.4' d='M11 11h10v10H11zM14 5v6M18 5v6M14 21v6M18 21v6M5 14h6M5 18h6M21 14h6M21 18h6'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="admin.css" rel="stylesheet">
</head>
<body>

<!-- ========== ACCESO ========== -->
<main class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
        <span class="mono-label">// Panel de administración</span>
        <h1>CIAP Informática</h1>
        <p class="aviso" id="loginAviso" hidden></p>
        <label>Usuario<input name="usuario" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn">Entrar</button>
        <a href="/" class="link">← Volver a la tienda</a>
    </form>
</main>

<!-- ========== PANEL ========== -->
<div class="app" id="app" hidden>
    <aside class="side">
        <div class="side-brand">CIAP<span>Panel</span></div>
        <nav id="menu">
            <button data-vista="resumen">Resumen</button>
            <button data-vista="pedidos">Pedidos <b data-n="pedidos" hidden></b></button>
            <button data-vista="mensajes">Mensajes <b data-n="mensajes" hidden></b></button>
            <button data-vista="productos">Productos</button>
            <button data-vista="categorias">Categorías</button>
            <button data-vista="servicios">Servicios</button>
            <button data-vista="tienda">Datos de la tienda</button>
            <button class="solo-movil" data-salir>Salir</button>
        </nav>
        <div class="side-foot">
            <a href="/" target="_blank" rel="noopener">Ver la tienda ↗</a>
            <button data-salir>Cerrar sesión</button>
        </div>
    </aside>
    <main class="main" id="vista"></main>
</div>

<dialog class="modal" id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
